spring:
  application:
    name: payment-inbox
  datasource:
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  provider:
    # Any value: CAPTURED -> SUCCEEDED, DECLINED -> FAILED, anything else -> UNKNOWN.
    outcome: ${APP_PROVIDER_OUTCOME:CAPTURED}
    callback-url: ${APP_PROVIDER_CALLBACK_URL:http://localhost:8080/provider-callbacks}
    min-delay-ms: ${APP_PROVIDER_MIN_DELAY_MS:2000}
    max-delay-ms: ${APP_PROVIDER_MAX_DELAY_MS:5000}
    connect-timeout-ms: ${APP_PROVIDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${APP_PROVIDER_READ_TIMEOUT_MS:5000}
    # Callback relay: how often due outbox rows are checked, and the retry policy.
    relay-interval-ms: ${APP_PROVIDER_RELAY_INTERVAL_MS:100}
    max-attempts: ${APP_PROVIDER_MAX_ATTEMPTS:5}
    initial-retry-ms: ${APP_PROVIDER_INITIAL_RETRY_MS:500}
    max-retry-ms: ${APP_PROVIDER_MAX_RETRY_MS:30000}
    # Disabled in most tests so they can drive callbacks deterministically.
    auto-callback: ${APP_PROVIDER_AUTO_CALLBACK:true}
  callback:
    # Optional: reject provider timestamps further ahead than this. Off by default so a valid
    # future timestamp follows the normal ordering rules.
    max-future-skew: ${APP_CALLBACK_MAX_FUTURE_SKEW:0s}
    auth:
      # Opt-in. The assignment contract is unsigned; enable this to require HMAC callbacks.
      enabled: ${APP_CALLBACK_AUTH_ENABLED:false}
      secret: ${APP_CALLBACK_AUTH_SECRET:}
      # A signed timestamp outside this window (either direction) is rejected as a replay.
      max-age: ${APP_CALLBACK_AUTH_MAX_AGE:5m}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
