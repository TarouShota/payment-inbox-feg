services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_PROVIDER_CALLBACK_URL: http://backend:8080/provider-callbacks
      APP_PROVIDER_OUTCOME: ${APP_PROVIDER_OUTCOME:-CAPTURED}
      APP_PROVIDER_MIN_DELAY_MS: ${APP_PROVIDER_MIN_DELAY_MS:-2000}
      APP_PROVIDER_MAX_DELAY_MS: ${APP_PROVIDER_MAX_DELAY_MS:-5000}
      APP_PROVIDER_AUTO_CALLBACK: ${APP_PROVIDER_AUTO_CALLBACK:-true}
      APP_PROVIDER_CONNECT_TIMEOUT_MS: ${APP_PROVIDER_CONNECT_TIMEOUT_MS:-2000}
      APP_PROVIDER_READ_TIMEOUT_MS: ${APP_PROVIDER_READ_TIMEOUT_MS:-5000}
      APP_PROVIDER_RELAY_INTERVAL_MS: ${APP_PROVIDER_RELAY_INTERVAL_MS:-100}
      APP_PROVIDER_MAX_ATTEMPTS: ${APP_PROVIDER_MAX_ATTEMPTS:-5}
      APP_PROVIDER_INITIAL_RETRY_MS: ${APP_PROVIDER_INITIAL_RETRY_MS:-500}
      APP_PROVIDER_MAX_RETRY_MS: ${APP_PROVIDER_MAX_RETRY_MS:-30000}
      APP_CALLBACK_MAX_FUTURE_SKEW: ${APP_CALLBACK_MAX_FUTURE_SKEW:-0s}
      APP_CALLBACK_AUTH_ENABLED: ${APP_CALLBACK_AUTH_ENABLED:-false}
      APP_CALLBACK_AUTH_SECRET: ${APP_CALLBACK_AUTH_SECRET:-}
      APP_CALLBACK_AUTH_MAX_AGE: ${APP_CALLBACK_AUTH_MAX_AGE:-5m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
